<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
  :root{ --navy:#0E2A33; --navy2:#081A20; --gold:#C9A24B; --cream:#F3EAD3; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px}
  body{
    font-family:"SF Arabic","Geeza Pro","Damascus",sans-serif;
    direction:rtl; color:var(--cream); overflow:hidden; position:relative;
    background:
      radial-gradient(120% 60% at 50% 112%, rgba(201,162,75,.30), rgba(201,162,75,0) 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy2) 60%, #05070a 100%);
  }
  body::before{content:"";position:absolute;inset:0;opacity:.06;pointer-events:none;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}
  .horizon{position:absolute;left:0;right:0;bottom:210px;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.75}
  .skyline{position:absolute;left:0;right:0;bottom:0;height:210px;
    background:linear-gradient(90deg,#04080b 0 6%,transparent 6% 9%,#04080b 9% 12%,transparent 12% 14%,#050a0e 14% 26%,transparent 26% 29%,#04080b 29% 40%,transparent 40% 43%,#060c11 43% 58%,transparent 58% 61%,#04080b 61% 74%,transparent 74% 77%,#050a0e 77% 90%,transparent 90% 93%,#04080b 93% 100%);
    -webkit-mask:linear-gradient(180deg,transparent,#000 45%)}
  .plant{position:absolute;bottom:34px;left:8%;right:8%;height:96px;opacity:.5;
    background:repeating-linear-gradient(90deg,#0a161c 0 14px,transparent 14px 40px);border-bottom:3px solid #0a161c}
  .content{position:relative;z-index:2;padding:78px 78px 0}
  .kicker{color:var(--gold);font-size:33px;font-weight:600;letter-spacing:1px;margin-bottom:18px}
  .brand{color:var(--gold);font-size:180px;font-weight:800;line-height:.9;letter-spacing:-2px;
    text-shadow:0 6px 44px rgba(201,162,75,.28)}
  .dek{color:var(--cream);font-size:48px;font-weight:600;line-height:1.28;margin-top:20px;max-width:840px}
  .rule{width:110px;height:5px;background:var(--gold);margin:34px 0 0;border-radius:3px}
  .stats{position:absolute;left:78px;right:78px;bottom:250px;z-index:2;display:flex;gap:30px;justify-content:space-between}
  .stat{flex:1;text-align:center;border-top:2px solid rgba(201,162,75,.35);padding-top:20px}
  .num{color:var(--gold);font-size:92px;font-weight:800;line-height:1}
  .lbl{color:var(--cream);opacity:.85;font-size:29px;font-weight:500;margin-top:12px;line-height:1.35}
  .foot{position:absolute;bottom:16px;left:78px;right:78px;z-index:2;text-align:center;
    color:var(--cream);opacity:.45;font-size:24px}
</style></head><body>
  <div class="horizon"></div><div class="skyline"></div><div class="plant"></div>
  <div class="content">
    <div class="kicker">قلب الصناعة العالمية</div>
    <div class="brand">المملكة</div>
    <div class="dek">أكبر منتج للمياه المحلاة على مستوى العالم</div>
    <div class="rule"></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num">%22</div><div class="lbl">من الإنتاج<br>العالمي</div></div>
    <div class="stat"><div class="num">+16</div><div class="lbl">مليون م³ / يوم<br>الطاقة الإنتاجية</div></div>
    <div class="stat"><div class="num">11</div><div class="lbl">رقماً قياسياً<br>في غينيس</div></div>
  </div>
  <div class="foot">sample poster · arabic-editorial-infographic</div>
</body></html>
